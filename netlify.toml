# Repository-level Netlify Configuration for SAMADHAN
# Directs build pipeline to client directory and publishes Vite production bundle

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
